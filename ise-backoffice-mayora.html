<script id="sim-data">
/* ==========================================================================
 * ISE BO simulator — DỮ LIỆU MẪU DUY NHẤT (window.MOCK). Cùng cửa hàng / sản phẩm / người với simulator app
 * (../mock-simulator/src/data.js): 10 cửa hàng C01–C10, NV Lê Quang Minh (NV001), GS Nguyễn Thị Thảo (GS003).
 * Phần mở rộng (thêm cửa hàng, lượt ghé, điểm 6 chu kỳ) sinh tất định bằng RNG có hạt giống → lần mở nào cũng ra cùng số.
 * ========================================================================== */
(function () {
  let seedN = 20261027; const rnd = () => { seedN = (seedN * 1103515245 + 12345) % 2147483648; return seedN / 2147483648; };
  const pick = a => a[Math.floor(rnd() * a.length)], rint = (a, b) => a + Math.floor(rnd() * (b - a + 1)), r1 = x => Math.round(x * 10) / 10;
  const p2 = n => String(n).padStart(2, '0'), today = new Date(), dmy = d => p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear();
  const addD = n => { const d = new Date(today); d.setDate(d.getDate() + n); return d; }, ym = d => d.getFullYear() + '-' + p2(d.getMonth() + 1);
  const dt = (n, h, m) => dmy(addD(n)) + ' ' + p2(h) + ':' + p2(m || 0);

  const chains = [
    { id: 'CH-COOP', code: 'COOP', name: 'Saigon Co.op', fmt: 'Siêu thị', prefix: 'CM', brand: 'Co.opmart' },
    { id: 'CH-WIN', code: 'WIN', name: 'Masan Retail (WinMart)', fmt: 'Siêu thị', prefix: 'WM', brand: 'WinMart' },
    { id: 'CH-AEON', code: 'AEON', name: 'AEON Việt Nam', fmt: 'Đại siêu thị', prefix: 'AE', brand: 'AEON' },
    { id: 'CH-LOTTE', code: 'LOTTE', name: 'Lotte Mart Việt Nam', fmt: 'Đại siêu thị', prefix: 'LT', brand: 'Lotte Mart' },
    { id: 'CH-BHX', code: 'BHX', name: 'Thế Giới Di Động (Bách Hoá Xanh)', fmt: 'Cửa hàng tiện lợi', prefix: 'BHX', brand: 'Bách Hoá Xanh' },
    { id: 'CH-GO', code: 'GO', name: 'Central Retail (GO!)', fmt: 'Đại siêu thị', prefix: 'GO', brand: 'GO!' },
    { id: 'CH-MM', code: 'MM', name: 'MM Mega Market', fmt: 'Đại siêu thị', prefix: 'MM', brand: 'MM Mega Market' },
    { id: 'CH-COOPX', code: 'COOPX', name: 'Saigon Co.op (Co.opXtra)', fmt: 'Đại siêu thị', prefix: 'CX', brand: 'Co.opXtra' }];
  const regions = [['HCM-Q1', 'HCM - Quận 1'], ['HCM-Q3', 'HCM - Quận 3'], ['HCM-PN', 'HCM - Phú Nhuận'], ['HCM-Q7', 'HCM - Quận 7'], ['HCM-TP', 'HCM - Tân Phú'], ['HCM-BT', 'HCM - Bình Tân'], ['HCM-TD', 'HCM - Thủ Đức'], ['HCM-GV', 'HCM - Gò Vấp']];
  const reps = [['U-PG01', 'NV001', 'Lê Quang Minh', 'HC', 'Nguyễn Thị Thảo'], ['U-PG02', 'NV002', 'Phạm Thị Hồng', 'HC', 'Nguyễn Thị Thảo'], ['U-PG03', 'NV003', 'Võ Thanh Tùng', 'SE', 'Nguyễn Thị Thảo'], ['U-PG04', 'NV004', 'Đặng Ngọc Ánh', 'MK', 'Nguyễn Thị Thảo'], ['U-PG05', 'NV005', 'Huỳnh Minh Khang', 'CE', 'Nguyễn Thị Thảo'], ['U-PG06', 'NV006', 'Trịnh Bảo Ngọc', 'NORTH', 'Nguyễn Thị Thảo']]
    .map(([id, code, name, mtRegion, reportTo]) => ({ id, code, name, mtRegion, reportTo, title: 'NVBH MT', user: name.split(' ').pop().toLowerCase() + '.' + name.split(' ').slice(0, -1).map(w => w[0].toLowerCase()).join('') }));
  const sup = { id: 'U-SUP01', code: 'GS003', name: 'Nguyễn Thị Thảo' }, kam = { id: 'U-KAM01', code: 'KAM01', name: 'Trần Quốc Bảo' };

  /* 10 cửa hàng trùng simulator app + 22 cửa hàng thêm cho BO */
  const appStores = [
    ['C01', 'CM-NKKN', 'Co.opmart Nguyễn Kiệm', 'CH-COOP', 'HCM-PN', '571-573 Nguyễn Kiệm, P.9, Phú Nhuận', 'A'], ['C02', 'CM-CQT', 'Co.opmart Cống Quỳnh', 'CH-COOP', 'HCM-Q1', '189C Cống Quỳnh, Q.1', 'A'],
    ['C03', 'WM-LM81', 'WinMart Landmark 81', 'CH-WIN', 'HCM-BT', 'Landmark 81, 720A Điện Biên Phủ, Bình Thạnh', 'A'], ['C04', 'AE-TP', 'AEON Tân Phú', 'CH-AEON', 'HCM-TP', '30 Bờ Bao Tân Thắng, Tân Phú', 'A+'],
    ['C05', 'LM-Q7', 'Lotte Mart Quận 7', 'CH-LOTTE', 'HCM-Q7', '469 Nguyễn Hữu Thọ, Q.7', 'A'], ['C06', 'BHX-1203', 'Bách Hoá Xanh Lê Văn Sỹ', 'CH-BHX', 'HCM-Q3', '342 Lê Văn Sỹ, Q.3', 'B'],
    ['C07', 'GO-AL', 'GO! An Lạc', 'CH-GO', 'HCM-BT', '1231 QL1A, Bình Tân', 'A'], ['C08', 'CM-XVNT', 'Co.opmart Xa Lộ Hà Nội', 'CH-COOP', 'HCM-TD', '191 Quang Trung, TP.Thủ Đức', 'A'],
    ['C09', 'MM-BP', 'MM Mega Market Bình Phú', 'CH-MM', 'HCM-BT', 'Đường số 1, Q.6', 'A'], ['C10', 'CX-PVD', 'Co.opXtra Phạm Văn Đồng', 'CH-COOPX', 'HCM-TD', 'TTTM Sense City, 240-242 Phạm Văn Đồng, TP.Thủ Đức', 'B']];
  const extraNames = [['CM', 'Co.opmart Đinh Tiên Hoàng'], ['CM', 'Co.opmart Phú Lâm'], ['CM', 'Co.opmart Hậu Giang'], ['CM', 'Co.opmart Rạch Miễu'], ['WM', 'WinMart Bình Trung'], ['WM', 'WinMart Thảo Điền'],
    ['WM', 'WinMart Cộng Hòa'], ['WM', 'WinMart Times City'], ['AE', 'AEON Bình Tân'], ['AE', 'AEON Celadon Tân Phú'], ['LT', 'Lotte Mart Cộng Hòa'], ['LT', 'Lotte Mart Gò Vấp'],
    ['BHX', 'Bách Hoá Xanh Gò Vấp #1244'], ['BHX', 'Bách Hoá Xanh Quang Trung #1307'], ['BHX', 'Bách Hoá Xanh Phan Văn Trị #1188'], ['BHX', 'Bách Hoá Xanh Nguyễn Oanh #1261'],
    ['GO', 'GO! Trường Chinh'], ['MM', 'MM Mega Market An Phú'], ['CX', 'Co.opXtra Linh Trung'], ['CM', 'Co.opmart Lý Thường Kiệt'], ['WM', 'WinMart Nguyễn Thị Minh Khai'], ['BHX', 'Bách Hoá Xanh Lê Đức Thọ #1290']];
  const stores = appStores.map(([id, code, name, ch, rg, addr, cls]) => ({ id, code, name, chain: ch, region: rg, address: addr, cls }));
  extraNames.forEach(([pf, name], i) => { const ch = chains.find(c => c.prefix === pf); stores.push({ id: 'S' + (11 + i), code: pf + '-' + (1000 + i * 37), name, chain: ch.id, region: pick(regions)[0], address: rint(10, 480) + ' ' + pick(['Nguyễn Văn Linh', 'Phan Văn Trị', 'Lê Văn Việt', 'Quang Trung', 'Trường Chinh', 'Cộng Hòa', 'Điện Biên Phủ']), cls: pick(['A', 'A', 'B', 'B', 'C']) }); });
  stores.forEach((s, i) => { const ch = chains.find(c => c.id === s.chain); Object.assign(s, { chainName: ch.name, format: ch.fmt, regionName: regions.find(r => r[0] === s.region)[1], rep: reps[i % reps.length].id,
    radius: ch.fmt === 'Cửa hàng tiện lợi' ? 80 : ch.fmt === 'Đại siêu thị' ? 200 : 100, orderModel: ['AEON', 'LOTTE', 'MM'].includes(ch.code) ? 'CentralPo' : ch.code === 'COOPX' ? 'None' : 'Dsd',
    status: s.id === 'S22' ? 'Closed' : 'Open', planoVer: 'PLG-COFFEE-MT v3', opened: dmy(addD(-rint(400, 2600))), contact: pick(['Trần Thu Hà', 'Phạm Văn Lộc', 'Nguyễn Hải Yến', 'Lê Minh Châu', 'Đỗ Mai Anh', 'Vũ Thanh Hương']) }); });

  const products = [
    ['KPK3IN1', 'Kopiko Blanca 3in1 hộp 12 gói', 'Kopiko', 'Cà phê', 39000, 24, 'Hộp', true], ['KPKCAP', 'Kopiko Cappuccino túi 10 gói', 'Kopiko', 'Cà phê', 52000, 24, 'Túi', true],
    ['KPKCANDY', 'Kẹo Kopiko Coffee Candy túi 150g', 'Kopiko', 'Kẹo', 18500, 48, 'Túi', true], ['TBCAP', 'Torabika Cappuccino hộp 5 gói', 'Torabika', 'Cà phê', 28000, 24, 'Hộp', false],
    ['ROMAMALK', 'Bánh quy Roma Malkist Crackers 135g', 'Roma', 'Bánh quy', 15500, 36, 'Gói', true], ['ROMAKLP', 'Bánh Roma Kelapa dừa 300g', 'Roma', 'Bánh quy', 24000, 24, 'Gói', true],
    ['BENGB', 'Bánh Beng-Beng socola hộp 20 thanh', 'Beng-Beng', 'Bánh xốp', 62000, 12, 'Hộp', true], ['CHOKI', 'Kem socola Choki-Choki hộp 20 que', 'Choki-Choki', 'Socola', 45000, 12, 'Hộp', false],
    ['LEMIN600', 'Nước khoáng Le Minerale 600ml', 'Le Minerale', 'Nước uống', 5500, 24, 'Chai', true], ['KOPIKOLAT', 'Kopiko Latte chai 240ml', 'Kopiko', 'Cà phê RTD', 14000, 24, 'Chai', false]]
    .map(([code, name, brand, cat, price, cnvt, uom, msl]) => ({ code, name, brand, cat, price, cnvt, uom, msl, rrp: Math.round(price * 1.08 / 500) * 500 }));

  /* 6 chu kỳ (tháng) điểm Perfect Store theo cửa hàng: cycle 0..5, 5 = tháng hiện tại */
  const cycles = [5, 4, 3, 2, 1, 0].map(k => { const d = new Date(today.getFullYear(), today.getMonth() - k, 1); return ym(d); });
  const pillars = [['OSA', 'Hiện diện trên kệ', 30, true], ['PRICE', 'Giá', 20, false], ['PLANOGRAM', 'Planogram', 20, false], ['DISPLAY', 'Trưng bày', 15, false], ['EXPIRY', 'Hạn dùng', 10, false], ['PROMO', 'Khuyến mãi', 5, false]];
  const scores = []; stores.filter(s => s.status === 'Open').forEach((s, si) => { let base = 70 + rnd() * 22 + (s.cls === 'A+' ? 4 : 0) - (s.cls === 'C' ? 6 : 0);
    cycles.forEach((c, ci) => { const n = ci === 5 ? rint(1, 3) : rint(2, 4); for (let k = 0; k < n; k++) { const lines = pillars.map(([code, , w]) => ({ code, w, raw: code === 'EXPIRY' && rnd() < .2 ? null : Math.max(35, Math.min(100, r1(base + (rnd() - .45) * 22 + (code === 'PLANOGRAM' ? -9 : code === 'OSA' ? 6 : 0)))) }));
      const inc = lines.filter(l => l.raw != null), tot = r1(inc.reduce((a, l) => a + l.raw * l.w, 0) / inc.reduce((a, l) => a + l.w, 0));
      scores.push({ store: s.id, cycle: c, ci, visit: 'VST-' + c.replace('-', '') + '-' + p2(si) + k, rep: s.rep, total: tot, pass: tot >= 80, lines, date: dmy(new Date(+c.slice(0, 4), +c.slice(5) - 1, Math.min(27, 3 + k * 9 + si % 5))) }); }
      base += (rnd() - .4) * 3; }); });

  /* lượt ghé tháng này (soát xét) */
  const visits = []; stores.slice(0, 18).forEach((s, i) => { for (let k = 0; k < 2; k++) { const day = -(k * 3 + (i % 3)), st = i === 4 && k === 0 ? 3 : i === 7 && k === 1 ? 2 : day === 0 && i % 5 === 2 ? 0 : 1;
    const h = 8 + (i % 8), dur = st === 3 ? 8 : rint(28, 64), req = 14, done = st === 1 ? req - (i % 3 === 0 ? 2 : 0) : st === 0 ? 4 : st === 3 ? 2 : 9;
    visits.push({ id: 'VST-' + (2610000 + visits.length * 7), store: s.id, rep: s.rep, status: st, planned: i % 6 !== 5, inAt: dt(day, h, (i * 7) % 60), outAt: st === 0 ? '' : st === 2 ? dt(day, 23, 59) : dt(day, h + Math.floor(dur / 60), ((i * 7) % 60 + dur) % 60),
      dur: st === 0 || st === 2 ? null : dur, done, total: 14, outside: i % 7 === 3, dist: i % 7 === 3 ? 312 : rint(8, 70), radius: s.radius, score: st === 1 ? (scores.find(x => x.store === s.id && x.ci === 5) || {}).total : null }); } });

  const issueTypes = [['OOS_CRIT', 'Hết hàng mặt hàng bắt buộc', 'Critical', 'Supervisor', 24, 'AVAILABILITY', 'MSL_MANDATORY_OOS', true, null], ['PRICE_DEV', 'Sai lệch giá bán', 'High', 'KAM', 24, 'PRICE_PROMO', 'PRICE_NON_COMPLIANT', false, 'Supervisor'],
    ['PLG_DEV', 'Sai lệch sơ đồ trưng bày', 'Medium', 'Merchandiser', 72, 'PLANOGRAM', 'PLANOGRAM_DEVIATION_UNFIXED', true, 'Supervisor'], ['EXP_NEAR', 'Hàng cận hạn hoặc hết hạn', 'Critical', 'Supervisor', 12, 'EXPIRY', 'EXPIRY_CRITICAL', true, null],
    ['POSM_MISS', 'Thiếu vật phẩm quảng cáo tại điểm bán', 'Medium', 'TradeMarketing', 72, null, null, false, 'Supervisor'], ['DISP_BREACH', 'Vi phạm cam kết trưng bày', 'High', 'Supervisor', 48, 'DISPLAY', 'DISPLAY_BREACH', false, null],
    ['STORE_REQ', 'Yêu cầu từ cửa hàng', 'Medium', 'Supervisor', 120, null, null, true, null], ['DC_OOS', 'Nhà phân phối hết hàng', 'High', 'KAM', 24, 'AVAILABILITY', 'MSL_DC_OOS', false, 'Supervisor'],
    ['PROMO_INACTIVE', 'Chương trình khuyến mãi chưa được kích hoạt', 'High', 'Supervisor', 12, 'PRICE_PROMO', 'PROMO_NOT_LIVE', false, null]]
    .map(([code, name, sev, owner, sla, from, rule, task, esc]) => ({ id: 'IT-' + code, code, name, sev, owner, sla, from, rule, task, esc, verify: true, active: true }));
  const sts = ['Open', 'Open', 'InProgress', 'InProgress', 'Resolved', 'Verified', 'Closed'];
  const issues = []; for (let i = 0; i < 26; i++) { const t = issueTypes[i % issueTypes.length], s = stores[(i * 5) % 24], ageH = rint(2, 260), st = i < 3 ? 'Open' : pick(sts);
    const created = new Date(today.getTime() - ageH * 36e5), due = new Date(created.getTime() + t.sla * 36e5), over = ['Open', 'InProgress'].includes(st) && due < today;
    const owner = t.owner === 'KAM' ? kam : t.owner === 'Supervisor' ? sup : reps.find(r => r.id === s.rep);

/* ===== 70-reports.js ===== */
/* ==========================================================================
 * 70 · RP / 17 báo cáo ISE — trình xem báo cáo (VIEW.razor): tab Bộ lọc → Xem trước khi in → tab Trình xem
 * Source: _analysis/03-reports.md (repx + fs_rp_ise_* + ReportScreenSeedData). Số liệu tính từ window.MOCK theo
 * đúng công thức của hàm SQL terminal; tiêu đề cột, nhãn enum, chân nhóm lấy từ repx.
 * ========================================================================== */
{ /* khối riêng: hằng/hàm của báo cáo không đụng tên với các file màn khác */
const G_RP = 'Báo cáo xếp loại CH';
const hh = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 100003; return h; };
const vn = (x, d) => x == null || isNaN(x) ? '—' : Number(x).toLocaleString('vi-VN', { minimumFractionDigits: d == null ? 1 : d, maximumFractionDigits: d == null ? 1 : d });
const vnd = x => x == null ? '—' : Math.round(x).toLocaleString('vi-VN');
const pc = (x, d) => x == null || isNaN(x) ? '—' : vn(x, d == null ? 1 : d) + ' %';
const toD = s => { const m = String(s || '').match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/); return m ? new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)) : null; };
const iso = d => d.getFullYear() + '-' + M.p2(d.getMonth() + 1) + '-' + M.p2(d.getDate());
const isoToday = () => iso(new Date());
const ymL = c => c.slice(5) + '/' + c.slice(0, 4);
const scopeStores = P => M.stores.filter(s => s.status === 'Open' && (!P.CHAIN || s.chain === P.CHAIN) && (!P.FORMAT || s.format === P.FORMAT));
const inRange = (P, s) => { const d = toD(s); if (!d) return false; const f = new Date(P.FROMDATE || isoToday()), t = new Date(P.TODATE || isoToday()); f.setHours(0, 0, 0, 0); t.setHours(23, 59, 59, 999); return d >= f && d <= t; };
const visitsIn = P => M.visits.filter(v => inRange(P, v.inAt) && (!P.CHAIN || storeOf(v.store).chain === P.CHAIN));
const cycOf = P => P.CYCLE || M.cycleNow;
const lastScore = (st, cyc) => M.scores.filter(x => x.store === st && x.cycle === cyc).slice(-1)[0];
const PASS_THR = 80;

/* ---- tham số (SEED: ReportScreenSeedData / ReportParameters) ---- */
const PARM = {
  CYCLE: { t: 'Chu kỳ', type: 'guid', lk: 'fs_lo_ise_cycle', opts: () => M.cycles.slice().reverse().map(c => [c, 'CK-' + c.replace('-', '') + ' · 01/' + ymL(c) + ' – ' + new Date(+c.slice(0, 4), +c.slice(5), 0).getDate() + '/' + ymL(c)]) },

function rptChart(c) { const W = 640, H = 200, n = c.pts.length, mx = Math.max(100, ...c.pts.map(p => p[1]), c.line || 0) * 1.1, x = i => 50 + i * (W - 70) / Math.max(1, n - (c.kind === 'line' ? 1 : 0)), y = v => H - 30 - v / mx * (H - 50);
  const marks = c.kind === 'line' ? `<polyline fill="none" stroke="#2563eb" stroke-width="2" points="${c.pts.map((p, i) => x(i) + ',' + y(p[1])).join(' ')}"/>${c.pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[1])}" r="3" fill="#2563eb"/><text x="${x(i)}" y="${H - 12}" font-size="10" text-anchor="middle">${p[0]}</text><text x="${x(i)}" y="${y(p[1]) - 7}" font-size="10" text-anchor="middle">${vn(p[1])}</text>`).join('')}`
    : c.pts.map((p, i) => `<rect x="${x(i) + 6}" y="${y(p[1])}" width="${(W - 70) / n - 14}" height="${H - 30 - y(p[1])}" fill="#5b8def"/><text x="${x(i) + (W - 70) / n / 2}" y="${H - 12}" font-size="10" text-anchor="middle">${p[0]}</text><text x="${x(i) + (W - 70) / n / 2}" y="${y(p[1]) - 4}" font-size="10" text-anchor="middle">${vn(p[1])}</text>`).join('');
  return `<p style="font-weight:700;margin:14px 0 4px">${c.title}</p><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;border:1px solid #e3e6ec"><line x1="45" y1="${H - 30}" x2="${W - 10}" y2="${H - 30}" stroke="#999"/>${c.line != null ? `<line x1="45" x2="${W - 10}" y1="${y(c.line)}" y2="${y(c.line)}" stroke="#dc2626" stroke-dasharray="5 4"/><text x="${W - 12}" y="${y(c.line) - 4}" font-size="10" text-anchor="end" fill="#dc2626">${c.lineLab || 'Chuẩn ' + c.line}</text>` : ''}${marks}</svg>`; }
function rptTable(t) { const th = t.cols.map(c => `<th class="${c[1] ? 'num' : ''}">${c[0]}</th>`).join(''), td = (r, cls) => `<tr class="${cls || ''}">${r.map((v, i) => `<td class="${t.cols[i] && t.cols[i][1] ? 'num' : ''}">${v == null ? '' : v}</td>`).join('')}</tr>`;
  const n = t.groups.reduce((a, g) => a + g.rows.length, 0);
  return (t.title ? `<p style="font-weight:700;margin:14px 0 6px">${t.title}</p>` : '') + `<table><thead><tr>${th}</tr></thead><tbody>${n ? t.groups.map(g => (g.h ? `<tr class="grp"><td colspan="${t.cols.length}">${g.h}</td></tr>` : '') + g.rows.map(r => td(r)).join('') + (g.foot ? td(g.foot, 'tot') : '')).join('') + (t.grand ? td(t.grand, 'tot') : '') : `<tr><td colspan="${t.cols.length}" style="text-align:center;color:#888;padding:18px">Chưa có dữ liệu trong phạm vi đã chọn.</td></tr>`}</tbody></table>`
    + (t.note ? `<p class="muted" style="font-size:11px;margin:4px 0">${t.note}</p>` : '') + (t.chart ? rptChart(t.chart) : '') + (t.gallery ? `<p style="font-weight:700;margin:14px 0 6px">Thư viện ảnh</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${Array.from({ length: Math.min(9, t.gallery) }, (_, i) => `<div style="height:80px;background:#e5e7eb;border-radius:4px;display:grid;place-items:center;font-size:11px;color:#666"><i class="fa-solid fa-image"></i> Ảnh ${i + 1}</div>`).join('')}</div>` : ''); }
const echo = (d, P) => d.params.map(k => { const p = PARM[k], v = P[k]; return p.t + ': ' + (p.type === 'bool' ? (v ? 'Có' : 'Không') : p.type === 'date' ? (v ? v.split('-').reverse().join('/') : (p.today ? M.today : 'mặc định')) : v ? ((p.opts().find(o => o[0] === v) || [0, v])[1]) : k === 'CYCLE' ? 'CK-' + M.cycleNow.replace('-', '') + ' (mặc định)' : 'Tất cả'); }).join(' · ');

RPT.forEach(d => {
  const link = '/Reports/' + d.code;
  reg({ link, code: d.code, title: d.menu, group: d.grp || G_RP, ws: d.noWs ? 'SUB' : undefined, type: 'page', file: 'Reports: ' + d.repx + ' · ' + d.chain.split(' → ').pop(), master: 'Reports.' + d.code, details: '—', tpl: 'Report viewer (VIEW.razor)',
    spec: { biz: [d.menu + ' — báo cáo ISE/MT trên DevExpress (repx ' + d.repx + ').', 'Truy vấn repx: ' + d.chain + '.'], flow: ['Tab Bộ lọc → nhập tham số → «Xem trước khi in» (kiểm tham số bắt buộc, ghi ReportRuntimes + CULTURE) → tab Trình xem.', '«Xuất báo cáo» xuất .xlsx từ cùng repx; «Đăng ký» lập lịch gửi email (Xlsx, cron mặc định 0 8 * * *).'],
      data: [['Dữ liệu nguồn', d.data, 'app ISE đồng bộ']].concat(d.params.filter(k => PARM[k].lk).map(k => ['Tham số ' + PARM[k].t, PARM[k].lk, 'lookup'])), rules: d.rules.concat(['Mặc định Từ/Đến ngày trên UI = hôm nay (không có DefaultValue); chu kỳ trống → fs_rp_ise_cycle_default.']),
      links: [{ to: '/Workspace/RP', label: 'Workspace Reports' }, { to: '/SalesDistribution/OutletGrading/Results', label: 'Kết quả xếp loại' }], api: [['POST api/app/report-runtimes · GET report viewer (repx)', 'Xem trước khi in', d.params.join(', '), 'trang báo cáo', 'Reports.' + d.code, 'đã có']] },
    render: () => { const st = X('rp:' + d.code, { tab: 0, P: {}, shown: 0, zoom: 100, err: '' });
      d.params.forEach(k => { if (PARM[k].today && st.P[k] == null) st.P[k] = isoToday(); });
      const field = k => { const p = PARM[k], v = st.P[k];
        const ctl = p.type === 'bool' ? `<label><input type="checkbox" ${v ? 'checked' : ''} data-chg="rpSet" data-k="${d.code}|${k}"> Có</label>` : p.type === 'date' ? `<input class="sim-in" type="date" value="${v || ''}" data-chg="rpSet" data-k="${d.code}|${k}">`
          : `<select class="sel" data-chg="rpSet" data-k="${d.code}|${k}"><option value="">${p.req ? '— chọn —' : 'Tất cả'}</option>${p.opts().map(o => `<option value="${o[0]}" ${o[0] === v ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
        return `<div class="fi"><div class="cap">${p.t}${p.req ? ' *' : ''}</div>${ctl}${p.req && st.err === k ? '<div style="color:var(--dx-danger);font-size:12px">Trường này là bắt buộc.</div>' : ''}</div>`; };
      const tabs = tabsbar([{ t: 'Bộ lọc', ic: 'fa-filter' }, { t: 'Trình xem', ic: 'fa-eye' }], st.tab, 'rpTab');
      const hasDate = d.params.includes('FROMDATE');
      const filt = card('', `<div style="display:flex;justify-content:space-between;align-items:center"><b>Tham số lọc</b><span>${btn('Xem trước khi in', 'fa-print', 'pri', 'rpPreview', d.code)} ${btn('Xuất báo cáo', 'fa-download', 'pri', 'rpExport', d.code)}</span></div><div class="fl" style="margin-top:10px">${d.params.map(field).join('')}</div>`
        + (hasDate ? `<p class="muted" style="font-size:12px">Từ/Đến ngày mặc định hôm nay như app thật. Chọn nhanh: <a data-act="rpRange" data-arg="${d.code}|0">Hôm nay</a> · <a data-act="rpRange" data-arg="${d.code}|6">7 ngày</a> · <a data-act="rpRange" data-arg="${d.code}|29">30 ngày</a></p>` : ''));
      let view = '';
      if (st.tab === 1) { if (!st.shown) view = card('', '<p class="muted" style="text-align:center;padding:40px">Vui lòng nhấp vào xem trước khi in để xem báo cáo</p>');
        else { const secs = d.build(st.P), n = secs.reduce((a, t) => a + t.groups.reduce((b, g) => b + g.rows.length, 0), 0), pages = Math.max(1, Math.ceil(n / 28));
          view = `<div class="rpt-bar"><i class="fa-solid fa-angles-left"></i><span style="white-space:nowrap">Trang 1 / ${pages}</span><i class="fa-solid fa-angles-right"></i> | <span style="white-space:nowrap">Zoom <select class="sel" style="width:90px;display:inline-block" data-chg="rpZoom">${['50', '75', '100', '125'].map(z => `<option value="${z}" ${+z === st.zoom ? 'selected' : ''}>${z}%</option>`).join('')}</select></span> | <a data-act="okMsg" data-arg="Đã gửi lệnh in">In</a> · <a data-act="rpExport" data-arg="${d.code}|pdf">PDF</a> · <a data-act="rpExport" data-arg="${d.code}">XLSX</a> · <a data-act="rpExport" data-arg="${d.code}|csv">CSV</a></div>`
            + `<div class="rpt-paper" style="zoom:${st.zoom / 100}"><div style="display:flex;justify-content:space-between;font-size:11px;color:#555"><span><b>CÔNG TY DEMO XSPIRE</b><br>${d.chLabel || 'Kênh hiện đại (MT) · eSales ISE'}</span><span>Ngày in: ${M.today}<br>Người in: Admin HQSOFT</span></div><h2>${d.title}</h2><div class="sub">${echo(d, st.P)}</div>${secs.map(rptTable).join('')}`
            + `<div style="display:flex;justify-content:space-around;margin-top:26px;font-size:12px;text-align:center"><div><b>Người lập</b><br><br><br>Admin HQSOFT</div><div><b>Trưởng đơn vị</b><br><br><br>&nbsp;</div></div><p class="muted" style="font-size:10px">Nguồn: ${d.chain.split(' → ').pop()} · ${d.repx}</p></div>`; } }
      return pageHeader(d.menu, [btn('Back', 'fa-undo', 'sec', 'go', '/Workspace/RP'), btn('Toàn màn hình', 'fa-expand', 'sec', 'okMsg', 'Đã bật toàn màn hình'), btn('Đăng ký', 'fa-envelope', 'sec', 'rpSub', d.code)]) + tabs + (st.tab === 0 ? filt : view); } });
});
Object.assign(ACT, {

  rpRange: a => { const [c, n] = a.split('|'), st = X('rp:' + c, {}); st.P.FROMDATE = iso(M.addD(-n)); st.P.TODATE = isoToday(); save(); render(); },

    if (miss) { st.err = miss; save(); render(); return toast('Trường này là bắt buộc.', 'w'); }
    loadingThen('Loading', () => { st.tab = 1; st.shown = 1; }, 'Đang nạp ' + d.repx + ' và chạy truy vấn…'); },
  rpExport: a => { const [c, f] = a.split('|'), d = RPT.find(x => x.code === c); toast('Đã xuất ' + d.repx.split('.')[0] + '.' + (f || 'xlsx'), ''); },

<div id="sim-dock"><div class="h"><b>eSales ISE · BO Mayora (Xếp loại CH MT)</b><p id="sim-sum"></p><input id="sim-q" placeholder="Tìm màn theo tên, mã hoặc route…" oninput="simList()"></div><div class="l" id="sim-l"></div><pre id="sim-out"></pre>

<script id="sim-dock-js">
const SIM_CODE = {};
(function () { const ws = (BO_CONFIG.workspaces || []).filter(w => !w.dead); let L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  ws.forEach((w, i) => { let n = 0; ORDER.filter(l => !REG[l].wsPage && wsOfScr(REG[l]) === w).forEach(l => { SIM_CODE[l] = 'B' + L[i] + (++n); }); }); })();
function simDock() { document.getElementById('sim-dock').classList.toggle('on'); simList(); }
function simList() {
  const q = (document.getElementById('sim-q').value || '').toLowerCase(); let h = '';
  (BO_CONFIG.workspaces || []).filter(w => !w.dead).forEach(w => { const it = ORDER.filter(l => SIM_CODE[l] && wsOfScr(REG[l]) === w && (!q || (SIM_CODE[l] + ' ' + REG[l].title + ' ' + l).toLowerCase().includes(q)));
    if (!it.length) return; h += `<div class="g">${w.title}</div>` + it.map(l => `<div class="i ${route(S.active).scr === REG[l] ? 'on' : ''}" onclick="nav('${l}')"><code>${SIM_CODE[l]}</code><span>${REG[l].title}<br><small style="color:#9aa3b5">${l}</small></span></div>`).join(''); });
  document.getElementById('sim-l').innerHTML = h; document.getElementById('sim-sum').textContent = Object.keys(SIM_CODE).length + ' màn/báo cáo · ' + (BO_CONFIG.workspaces || []).filter(w => !w.dead).length + ' workspace · dữ liệu giả lập';
}
/* Tự kiểm tra: mở mọi màn (CRUD mở cả dòng đầu + Thêm mới), bắt lỗi dựng màn, kiểm spec đủ mục, link spec trỏ màn có thật */
function simTest() {
  const snap = JSON.stringify(S), bad = [], ce = console.error; let last = null; console.error = (...a) => { last = a.join(' '); };
  ORDER.forEach(l => { const s = REG[l]; const tryNav = p => { last = null; S.active = p; render(); if (document.querySelector('#app .note.dan') || last) bad.push(p + ': ' + (last || 'note.dan')); };
    try { tryNav(l); if (s.type === 'crud') { const r = s.list.rows()[0]; if (r) tryNav(l + '/' + encodeURIComponent(r.id)); if (s.blankId) tryNav(l + '/new'); } } catch (e) { bad.push(l + ': ' + e.message); }
    if (!s.wsPage) { const sp = s.spec || {}; ['biz', 'flow', 'data', 'rules', 'links', 'api'].forEach(k => { if (!sp[k] || (Array.isArray(sp[k]) && !sp[k].length)) bad.push(l + ': spec.' + k + ' rỗng'); });
      (sp.links || []).forEach(x => { if (x && x.to && !route(x.to).scr && !route(x.to).home) bad.push(l + ': link → ' + x.to + ' không có'); }); } });
  console.error = ce; S = JSON.parse(snap); save(); render();
  const o = document.getElementById('sim-out'); o.style.display = 'block';
  o.textContent = `Màn: ${ORDER.length} (gồm ${ORDER.filter(l => REG[l].wsPage).length} trang workspace)\nLỗi: ${bad.length}\n` + (bad.join('\n') || 'Mọi màn dựng được, spec đủ 6 mục, liên kết hợp lệ.');
  return { screens: ORDER.length, errors: bad.length, bad };
}
